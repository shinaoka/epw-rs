[workspace]
members = [
    "crates/phys-units",
    "crates/eph-comm",
    "crates/smearing",
    "crates/bz-mesh",
    "crates/eph-wannier-data",
    "crates/eph-io-epw",
    "crates/wannier-interp",
    "crates/eph-selfen",
    "crates/eph-driver",
    "crates/eliashberg",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.96"
# EPW's licence is carried over: GPL-2.0. See LICENSE and AUTHORS.md.
license = "GPL-2.0-only"
authors = ["Hiroshi Shinaoka", "The EPW Collaboration (algorithms and reference data)"]
publish = false

[workspace.dependencies]
num-complex = "0.4"
libm = "0.2"
thiserror = "2"
# tenferro is taken from crates.io (0.7.1). tensor4all-rs pins a git revision
# instead; a registry version is enough for this demonstration.
tenferro-tensor = "0.7.1"
tenferro-runtime = "0.7.1"
tenferro-cpu = "0.7.1"
tenferro-einsum = "0.7.1"
tenferro-linalg = "0.7.1"
tenferro-fft = "0.7.1"
# Intermediate-representation basis (optional feature of `eliashberg`); built on tenferro-tensor 0.7.1.
sparse-ir = "0.13.0"

phys-units = { path = "crates/phys-units" }
eph-comm = { path = "crates/eph-comm" }
smearing = { path = "crates/smearing" }
bz-mesh = { path = "crates/bz-mesh" }
eph-wannier-data = { path = "crates/eph-wannier-data" }
eph-io-epw = { path = "crates/eph-io-epw" }
wannier-interp = { path = "crates/wannier-interp" }
eph-selfen = { path = "crates/eph-selfen" }
eph-driver = { path = "crates/eph-driver" }
eliashberg = { path = "crates/eliashberg" }

[profile.dev]
debug = "line-tables-only"

[profile.test]
opt-level = 2
